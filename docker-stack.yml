# ==============================================================================
# Docker Swarm stack (production) — SPEC-INFRA-001 하드닝 적용
#
# 이미지 태그 (REQ-INFRA-003, 불변 태그):
#   - 모든 앱 서비스는 `image: ${IMAGE_TAG:-kmcbeauty-api:local}` 로 주입한다.
#   - 운영/CD 배포 시 반드시 불변 커밋 SHA 태그를 주입한다:
#        IMAGE_TAG=ghcr.io/antam2010/kmcbeauty-api:<git-sha> \
#          docker stack deploy -c docker-stack.yml kmcbeauty
#   - IMAGE_TAG 미지정 시 폴백(`kmcbeauty-api:local`)은 단일 노드 로컬 빌드 전용이며,
#     멀티 노드/운영에서는 노드에 해당 이미지가 없어 pull 이 즉시 실패한다(무한 재시도 방지).
#   - 가변 `latest` 태그는 절대 사용하지 않는다(latest-tag digest 함정 → 롤링 배포 파손).
#
# 환경 변수 (REQ-INFRA-001, env 분리):
#   - 배포는 `.env.prod` 만 참조한다(로컬용 `.env` 사용 금지).
#   - Redis 는 스택 전체 서비스명 DNS(`redis://kmcbeauty_redis:6379/0`)로 접근한다.
#     짧은 이름 `redis` 는 공유 네트워크의 다른 컨테이너(구 compose 의 container_name: redis 등)와
#     겹칠 수 있다. rate limit 저장소도 같은 Redis 의 DB 1 을 쓴다(RATE_LIMIT_STORAGE_URI).
#   - FORWARDED_ALLOW_IPS(.env.prod)= shared_network_prod 서브넷 CIDR. uvicorn 이 NGINX 의
#     X-Forwarded-For 를 신뢰해 실제 클라이언트 IP 를 복원한다(rate limit 키). `*` 금지.
#
# 시크릿 (REQ-INFRA-002 Firebase + SPEC-INFRA-002 REQ-INFRA-106/107):
#   - Firebase 서비스 계정 키는 Docker secret(`firebase_service_account`)으로 주입한다.
#   - 사전 1회 등록:  docker secret create firebase_service_account ./firebase-service-account.json
#   - 컨테이너 내부 경로는 /run/secrets/firebase_service_account 로 고정한다.
#   - SECRET_KEY/FERNET_KEY/DATABASE_URL 은 소문자 버전드 external 시크릿
#     (kmc_secret_key_v1/kmc_fernet_key_v1/kmc_database_url_v1)으로 주입하며,
#     secrets.target 으로 컨테이너 파일명을 pydantic 필드명에 정렬한다
#     (target=SECRET_KEY → /run/secrets/SECRET_KEY). 등록·회전 절차는 docs/deployment.md 참조.
#
# 배포:
#   - `docker stack deploy` 는 이미지를 빌드하지 않는다. CD 가 GHCR 로 빌드/푸시하고
#     매니저 노드에서 IMAGE_TAG 를 주입해 배포한다(scripts/deploy_migrate.sh 로 사전 마이그레이션).
#
# 네트워킹:
#   - 어떤 서비스도 호스트 포트를 공개하지 않는다. 외부 NGINX 가 동일한
#     `shared_network_prod` 오버레이에 붙어 서비스 DNS(kmcbeauty_api:8000)로 라우팅한다.
#   - `shared_network_prod` 에는 kmcbeauty_api 만 붙는다. Redis(무인증)/Celery 는 스택 전용
#     오버레이 `backend`(실제 이름 kmcbeauty_backend)에만 붙어 공유 네트워크에서 보이지 않는다.
# ==============================================================================
# (compose spec 기준 `version:` 필드는 obsolete — 최신 docker stack deploy 도 불필요)

services:
  # --- FastAPI application ---------------------------------------------------
  # Reachable by NGINX at:  kmcbeauty_api:8000  (over shared_network_prod)
  kmcbeauty_api:
    image: ${IMAGE_TAG:-kmcbeauty-api:local}
    # command 미지정 → 이미지 CMD(uvicorn :8000) 사용. 포트 정의는 Dockerfile 한 곳으로 일원화.
    env_file:
      # 배포 전용 env. 로컬 `.env` 를 배포에 사용하지 않는다(REQ-INFRA-001).
      - .env.prod
    environment:
      # 시크릿 경로는 스택에서 고정(.env.prod 누락 시에도 항상 동일 경로 보장, REQ-INFRA-002).
      FIREBASE_SERVICE_ACCOUNT_KEY_PATH: /run/secrets/firebase_service_account
      # 컨테이너 로깅은 stdout 단일화(docker service logs 로 수집) — 파일 로그 비활성.
      LOG_TO_FILE: "false"
    secrets:
      - firebase_service_account
      # SPEC-INFRA-002 신규 시크릿(REQ-INFRA-107): external 이름은 소문자·버전드,
      # target(컨테이너 파일명)은 pydantic 필드명과 정확히 일치 → /run/secrets/<필드명>.
      # 회전 시 source 만 _v2 로 교체하고 target 은 불변이므로 앱 코드는 회전 무관.
      - source: kmc_secret_key_v1
        target: SECRET_KEY
      - source: kmc_fernet_key_v1
        target: FERNET_KEY
      - source: kmc_database_url_v1
        target: DATABASE_URL
    networks:
      # NGINX 유입용(공유) + Redis 접근용(스택 전용).
      - shared_network_prod
      - backend
    # 서비스 레벨 헬스체크(REQ-INFRA-004): 롤링 업데이트가 각 새 레플리카의
    # /health 통과를 확인한 뒤 다음 레플리카로 진행하도록 게이팅한다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 30s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        # monitor: 새 태스크가 이 시간 동안 healthy 를 유지해야 성공으로 간주(헬스 게이팅).
        monitor: 30s
        # max_failure_ratio: 0 → 한 태스크라도 실패하면 롤백을 트리거(무중단 우선).
        max_failure_ratio: 0
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # --- Redis (broker + app cache + rate limit) ------------------------------
  # Internal-only. Reachable on the backend overlay at:  kmcbeauty_redis:6379
  # (DB 0 = Celery broker/cache, DB 1 = rate limit counters)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      # 무인증 Redis 이므로 공유 네트워크(shared_network_prod)에는 붙이지 않는다.
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        window: 30s
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  # --- Celery worker ---------------------------------------------------------
  # Same image as the API. Swarm ignores depends_on ordering, so the worker
  # relies on restart_policy + Celery broker retry to wait for Redis.
  celery_worker:
    image: ${IMAGE_TAG:-kmcbeauty-api:local}
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - .env.prod
    environment:
      # 워커 태스크가 FCM 을 전송하므로 동일 시크릿 경로를 고정한다(REQ-INFRA-002).
      FIREBASE_SERVICE_ACCOUNT_KEY_PATH: /run/secrets/firebase_service_account
      LOG_TO_FILE: "false"
    secrets:
      - firebase_service_account
      # SPEC-INFRA-002 신규 시크릿(REQ-INFRA-107): external 이름은 소문자·버전드,
      # target(컨테이너 파일명)은 pydantic 필드명과 정확히 일치 → /run/secrets/<필드명>.
      # 회전 시 source 만 _v2 로 교체하고 target 은 불변이므로 앱 코드는 회전 무관.
      - source: kmc_secret_key_v1
        target: SECRET_KEY
      - source: kmc_fernet_key_v1
        target: FERNET_KEY
      - source: kmc_database_url_v1
        target: DATABASE_URL
    networks:
      # 외부 유입이 없으므로 스택 전용 네트워크만. FCM/DB 이그레스는 오버레이에서 그대로 가능.
      - backend
    # 이미지 내장 HEALTHCHECK(curl /health)는 웹서버 전용 — celery 프로세스가 상속하면
    # 헬스 실패로 태스크가 kill-loop 되므로 명시적으로 비활성화한다.
    healthcheck:
      disable: true
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
        window: 30s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  # --- Celery beat (scheduler) ----------------------------------------------
  # MUST be a single replica to avoid duplicate scheduled task dispatch.
  celery_beat:
    image: ${IMAGE_TAG:-kmcbeauty-api:local}
    command: celery -A celery_app beat --loglevel=info
    env_file:
      - .env.prod
    environment:
      # beat 는 celery_app 로드 시 app.core.firebase 를 전이 import 하므로
      # 초기화 실패를 막기 위해 동일 시크릿 경로를 제공한다(REQ-INFRA-002).
      FIREBASE_SERVICE_ACCOUNT_KEY_PATH: /run/secrets/firebase_service_account
      LOG_TO_FILE: "false"
    secrets:
      - firebase_service_account
      # SPEC-INFRA-002 신규 시크릿(REQ-INFRA-107): external 이름은 소문자·버전드,
      # target(컨테이너 파일명)은 pydantic 필드명과 정확히 일치 → /run/secrets/<필드명>.
      # 회전 시 source 만 _v2 로 교체하고 target 은 불변이므로 앱 코드는 회전 무관.
      - source: kmc_secret_key_v1
        target: SECRET_KEY
      - source: kmc_fernet_key_v1
        target: FERNET_KEY
      - source: kmc_database_url_v1
        target: DATABASE_URL
    networks:
      - backend
    # 이미지 내장 HEALTHCHECK 상속 방지(웹서버 아님) — worker 와 동일한 이유.
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      # 스케줄러는 단일 인스턴스 — 중복 기동 방지를 위해 stop-first,
      # 업데이트 실패 시 pause 가 아닌 자동 롤백 (REQ-INFRA-011)
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        window: 30s
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

networks:
  # External overlay network shared with the NGINX reverse proxy.
  # Create once (if not present):
  #   docker network create --driver overlay --attachable shared_network_prod
  # CD 사전 검증이 driver/scope 가 `overlay swarm` 인지 확인한다(bridge 면 배포 중단).
  shared_network_prod:
    external: true
  # 스택 전용 오버레이(실제 이름 kmcbeauty_backend). api·redis·worker·beat 내부 통신용.
  # internal: true 로 두지 않는다 — worker/beat 가 FCM(인터넷)·외부 PostgreSQL 로 나가야 한다.
  # 첫 stack deploy 때 생성되므로, 그 이전에 도는 마이그레이션(deploy_migrate.sh)은 이 망을 쓰지 않는다.
  backend:
    driver: overlay

volumes:
  redis_data:

secrets:
  # Firebase 서비스 계정 키(REQ-INFRA-002). 저장소에 커밋하지 않는다.
  # 매니저 노드에서 사전 1회 등록:
  #   docker secret create firebase_service_account ./firebase-service-account.json
  firebase_service_account:
    external: true

  # SPEC-INFRA-002 신규 시크릿(REQ-INFRA-106). external 이름은 소문자 + 버전 suffix(_v1).
  # 값은 저장소에 두지 않고 매니저 노드에서 stdin 으로 사전 1회 등록한다(평문 파일 지양):
  #   printf %s "$SECRET_KEY"   | docker secret create kmc_secret_key_v1 -
  #   printf %s "$FERNET_KEY"   | docker secret create kmc_fernet_key_v1 -
  #   printf %s "$DATABASE_URL" | docker secret create kmc_database_url_v1 -
  # 회전: kmc_..._v2 를 만들고 각 서비스의 secrets.source 를 _v2 로 교체(target 불변) 후
  #       docker stack deploy → 롤아웃 완료 후 docker secret rm 구버전. 상세는 docs/deployment.md.
  # 주의: REDIS_URL 은 자격 증명이 없어 시크릿이 아니다 → .env.prod 에 잔류(REQ-INFRA-106).
  #       Redis 는 backend 전용망에만 있어 스택 밖에서는 접근할 수 없다.
  kmc_secret_key_v1:
    external: true
  kmc_fernet_key_v1:
    external: true
  kmc_database_url_v1:
    external: true
