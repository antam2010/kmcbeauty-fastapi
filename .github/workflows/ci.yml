# ==============================================================================
# CI 파이프라인 (SPEC-INFRA-001, REQ-INFRA-006 / REQ-INFRA-007)
#
# 목적: 코드 품질 게이트를 자동 강제한다.
#   checkout → Python 3.13(+pip 캐시) → 의존성 설치
#     → ruff check → ruff format --check → pytest(커버리지 리포트)
#
# 트리거:
#   - pull_request : PR 품질 게이트.
#   - workflow_call: cd.yml 이 main push 시 빌드·배포 전에 같은 커밋으로 호출한다(배포 게이트).
#     main push 트리거는 두지 않는다 — CD 가 이미 CI 를 돌리므로 이중 실행이 된다.
#
# 동시성(재사용 워크플로 주의):
#   - 호출될 때 github 컨텍스트는 호출자 것이다(github.workflow == "CD", event_name == push).
#   - 그룹에 github.workflow 를 넣어 PR 실행(ci-CI-<ref>)과 CD 내부 실행(ci-CD-<ref>)을 분리한다.
#     호출자 CD 의 그룹(production-deploy)과도 달라 교착/상호 취소가 없다.
#   - 취소는 PR 에서만 한다. CD 안의 CI 가 취소되면 그 커밋의 빌드·배포가 건너뛰어진다.
#
# Redis 서비스 컨테이너를 두지 않는 이유:
#   현재 테스트 스위트는 DB/Redis/외부 연동을 모두 모킹하므로(tests/conftest.py 는
#   환경변수만 주입) 실제 Redis 브로커가 필요 없다. 통합 테스트가 추가되면
#   `services: redis:` 블록을 여기에 추가한다.
#
# 커버리지: 리포트만 출력하며 --cov-fail-under 게이트는 두지 않는다(REQ-INFRA-006 결정).
# ==============================================================================
name: CI

on:
  pull_request:
  workflow_call:

# GITHUB_TOKEN 최소 권한 (읽기 전용). 호출될 때도 호출자 권한에서 더 낮출 수만 있다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & Test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 린트: py313 규칙(pyproject.toml target-version=py313)으로 정합.
      - name: Ruff lint (check)
        run: ruff check .

      - name: Ruff format (check)
        run: ruff format --check .

      # 테스트: 커버리지 리포트 출력(게이트 없음).
      - name: Pytest with coverage report
        run: pytest --cov=app --cov=worker --cov-report=term-missing --cov-report=xml
