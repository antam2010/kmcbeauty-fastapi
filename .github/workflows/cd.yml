# ==============================================================================
# CD 파이프라인 (SPEC-INFRA-001, REQ-INFRA-008 / 009 / 010) — 운영 서버(docker compose)
#
# 목적: main 병합 시 CI 를 통과한 커밋만 불변 SHA 태그로 GHCR 에 게시하고,
#       운영 서버에 SSH 로 접속해 백업·마이그레이션 후 compose 프로젝트(kmcbeauty)를 갱신한다.
#       승인 게이트는 없다(main 병합 = 운영 배포). 리뷰는 PR 단계에서 한다.
#
# 흐름:
#   ci:             ci.yml 재사용 호출(같은 커밋) — 실패하면 아래 잡은 모두 건너뛴다
#   build-and-push: GHCR 로그인 → docker build → push ghcr.io/<owner>/kmcbeauty-api:<sha>
#                   → 푸시한 이미지 스모크(import app.main, celery_app)
#   deploy:         OpenSSH(호스트 키 고정, BatchMode) → 서버의 강제 명령 scripts/deploy_entry.sh 가
#                   "deploy <sha>" 만 받아 main 의 그 커밋을 체크아웃하고 scripts/deploy.sh 를 실행
#                   (전제 검사 → pull → pg_dump → 마이그레이션 → compose up --wait → 상태 확인 → 스모크).
#                   서버 쪽 사전 검사는 모두 deploy.sh 에 있다(여기서 중복하지 않는다).
#
# 필요한 저장소 시크릿(docs/deployment.md 6절 · 10절, 등록은 scripts/setup_github_secrets.sh):
#   DEPLOY_SSH_HOST        : 서버 SSH 호스트(Cloudflare 프록시를 거치지 않는 이름/IP)
#   DEPLOY_SSH_PORT        : 서버 SSH 포트
#   DEPLOY_SSH_USER        : 배포 계정
#   DEPLOY_SSH_KEY         : CI 전용 개인키 — 서버에서 강제 명령(deploy_entry.sh)에만 묶인다
#   DEPLOY_SSH_KNOWN_HOSTS : 서버 호스트 키(known_hosts 형식) — StrictHostKeyChecking=yes 로 고정
#   (GHCR 푸시와 서버의 pull 은 잡마다 발급되는 GITHUB_TOKEN 을 쓴다. 서버에는 stdin 으로만 넘긴다.)
#
# 공개 저장소: 호스트·포트·계정·LAN 주소는 저장소에 쓰지 않고 시크릿으로만 둔다.
#   Actions 로그도 공개이므로 deploy.sh 는 IP·서브넷·앱 로그를 출력하지 않는다.
# ==============================================================================
name: CD

on:
  push:
    branches: [main]

# 기본 GITHUB_TOKEN 은 읽기 전용. GHCR 푸시가 필요한 잡만 packages: write 로 올린다.
permissions:
  contents: read

# 배포 직렬화: 한 번에 하나의 CD 만 실행하고, 진행 중인 배포는 취소하지 않는다.
#   - 잡(deploy) 단위가 아니라 워크플로 단위로 건다. 잡 단위면 CI·빌드가 먼저 끝난 신규 커밋이
#     먼저 배포된 뒤, 대기하던 구 커밋 배포가 나중에 덮어쓸 수 있다(구버전 역배포).
#   - 대기(pending)는 최대 1건이다. 더 새로운 push 가 오면 대기 중인 실행은 취소·대체된다.
#   - 호출하는 ci.yml 의 그룹(ci-CD-<ref>)과 이름이 달라 교착이 생기지 않는다.
#   - 서버의 deploy_entry.sh · deploy.sh 도 파일 잠금(flock)으로 동시 실행을 막는다(수동 배포 포함).
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # GHCR 이미지 경로(소문자 owner 규약).
  IMAGE: ghcr.io/antam2010/kmcbeauty-api

jobs:
  # 배포 게이트: 같은 커밋으로 CI(lint·format·test)를 먼저 통과해야 한다.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    name: Build & Push image (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 불변 SHA 태그로만 푸시한다(REQ-INFRA-003). latest 태그는 생성하지 않는다.
      # source 라벨: 패키지를 이 저장소에 연결한다. 첫 게시 때 연결돼야 저장소 권한을 상속해
      # deploy 잡의 GITHUB_TOKEN(packages: read)으로 서버가 pull 할 수 있다(GHCR 패키지는 기본 비공개).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 푸시한 그 이미지(레지스트리에서 pull)로 import 스모크. 실패(종료 코드 != 0)면 잡 실패 →
      # deploy 는 실행되지 않는다. 더미 env 만 쓰고 --network none 으로 외부 접속을 차단한다
      # (import 시점에 DB/Redis 에 접속하지 않는다는 전제도 함께 검증).
      # firebase 키 미설정 로그는 정상이다(경로 미설정 → 초기화 스킵).
      - name: Smoke test pushed image
        timeout-minutes: 5
        run: |
          docker run --rm --network none \
            -e SECRET_KEY=ci-smoke-dummy-secret \
            -e FERNET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e DATABASE_URL=postgresql+psycopg://u:p@localhost:5432/db \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_SECONDS=900 \
            -e REFRESH_TOKEN_EXPIRE_SECONDS=1209600 \
            -e APP_ENV=production \
            -e LOG_TO_FILE=false \
            -e REDIS_URL=redis://localhost:6379/0 \
            "${{ env.IMAGE }}:${{ github.sha }}" \
            python -c "import app.main, celery_app"

  deploy:
    name: Deploy to production server (SSH forced command)
    needs: build-and-push
    runs-on: ubuntu-latest
    # 배포 이력용 environment. 필수 리뷰어는 두지 않는다(승인 게이트 없음 — main 병합 = 배포).
    environment: production
    # 정상 배포는 수 분(pull · 백업 · 마이그레이션 · compose up --wait ≤ 3분 · 스모크). 끊기면 서버 쪽도 중단된다.
    timeout-minutes: 20
    # 서버가 이 잡의 GITHUB_TOKEN 으로 GHCR 이미지를 pull 한다(잡이 끝나면 토큰은 만료된다).
    permissions:
      contents: read
      packages: read
    steps:
      # 서드파티 SSH 액션 없이 러너의 OpenSSH 를 쓴다. 시크릿은 run 스크립트에 직접 끼우지 않고
      # env 로만 넘긴다. 원격 명령은 "deploy <sha>" 하나뿐이며 서버의 강제 명령이 형식을 다시 검사한다.
      - name: Deploy over SSH (forced command)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_PORT DEPLOY_SSH_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::배포용 저장소 시크릿이 비어 있습니다:${missing} — scripts/setup_github_secrets.sh 로 등록하세요(docs/deployment.md 6절)."
            exit 1
          fi
          ssh_dir="$(mktemp -d "${RUNNER_TEMP}/deploy-ssh.XXXXXX")"
          trap 'rm -rf "${ssh_dir}"' EXIT
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${ssh_dir}/id_deploy"
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${ssh_dir}/known_hosts"
          chmod 600 "${ssh_dir}/id_deploy" "${ssh_dir}/known_hosts"
          # stdin 첫 줄 = GHCR pull 토큰(서버의 deploy_entry.sh 가 읽는다). 호스트 키는 시크릿 것만 믿는다.
          printf '%s\n' "${GITHUB_TOKEN}" | ssh -T \
            -i "${ssh_dir}/id_deploy" \
            -p "${DEPLOY_SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${ssh_dir}/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" "deploy ${GITHUB_SHA}"
