# ==============================================================================
# CD 파이프라인 (SPEC-INFRA-001, REQ-INFRA-008 / 009 / 010)
#
# 목적: main 병합 시 CI 를 통과한 커밋만 불변 SHA 태그로 GHCR 에 게시하고,
#       매니저 노드에 SSH 로 접속해 마이그레이션 후 스택을 무중단 배포한다.
#
# 흐름:
#   ci:             ci.yml 재사용 호출(같은 커밋) — 실패하면 아래 잡은 모두 건너뛴다
#   build-and-push: GHCR 로그인 → docker build → push ghcr.io/<owner>/kmcbeauty-api:<sha>
#                   → 푸시한 이미지 스모크(import app.main, celery_app)
#   deploy:         environment=production(수동 승인 가능) → SSH(호스트 키 검증 선택)
#                   → 사전 검증 → 커밋 SHA 고정 체크아웃 → deploy_migrate → stack deploy
#
# 사전 검증(SPEC-INFRA-002 REQ-INFRA-113 + 첫 Swarm 배포 차단 이슈):
#   서버 상태를 바꾸기(체크아웃·마이그레이션) 전에 아래를 확인하고 하나라도 어긋나면 중단한다.
#   - 필수 Docker secret(kmc_secret_key_v1/kmc_fernet_key_v1/kmc_database_url_v1/
#     firebase_service_account) 존재
#   - .env.prod 존재, 시크릿 키(SECRET_KEY/FERNET_KEY/DATABASE_URL) 정의 줄 부재
#   - REDIS_URL 설정·localhost 아님, FORWARDED_ALLOW_IPS 설정·`*` 아님
#   - shared_network_prod 가 `overlay swarm`
#
# 필요한 저장소 시크릿(docs/deployment.md 참조):
#   SWARM_SSH_HOST        : 매니저 노드 호스트/IP
#   SWARM_SSH_USER        : 배포 계정(로그인 셸 bash, docker 그룹, ghcr.io 로그인 완료)
#   SWARM_SSH_KEY         : 배포 계정 개인키(최소 권한)
#   SWARM_SSH_FINGERPRINT : (선택) 호스트 키 지문 "SHA256:..." — 미등록 시 검증 생략
#   (GHCR 푸시는 기본 제공되는 GITHUB_TOKEN + packages:write 권한 사용)
# ==============================================================================
name: CD

on:
  push:
    branches: [main]

# 기본 GITHUB_TOKEN 은 읽기 전용. GHCR 푸시가 필요한 잡만 packages: write 로 올린다.
permissions:
  contents: read

# 배포 직렬화: 한 번에 하나의 CD 만 실행하고, 진행 중인 배포는 취소하지 않는다.
#   - 잡(deploy) 단위가 아니라 워크플로 단위로 건다. 잡 단위면 CI·빌드가 먼저 끝난 신규 커밋이
#     먼저 배포된 뒤, 대기하던 구 커밋 배포가 나중에 덮어쓸 수 있다(구버전 역배포).
#   - 대기(pending)는 최대 1건이다. 더 새로운 push 가 오면 대기 중인 실행은 취소·대체된다.
#   - 호출하는 ci.yml 의 그룹(ci-CD-<ref>)과 이름이 달라 교착이 생기지 않는다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # GHCR 이미지 경로(소문자 owner 규약).
  IMAGE: ghcr.io/antam2010/kmcbeauty-api

jobs:
  # 배포 게이트: 같은 커밋으로 CI(lint·format·test)를 먼저 통과해야 한다.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    name: Build & Push image (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 불변 SHA 태그로만 푸시한다(REQ-INFRA-003). latest 태그는 생성하지 않는다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 푸시한 그 이미지(레지스트리에서 pull)로 import 스모크. 실패(종료 코드 != 0)면 잡 실패 →
      # deploy 는 실행되지 않는다. 더미 env 만 쓰고 --network none 으로 외부 접속을 차단한다
      # (import 시점에 DB/Redis 에 접속하지 않는다는 전제도 함께 검증).
      # firebase 키 미설정 로그는 정상이다(경로 미설정 → 초기화 스킵).
      - name: Smoke test pushed image
        timeout-minutes: 5
        run: |
          docker run --rm --network none \
            -e SECRET_KEY=ci-smoke-dummy-secret \
            -e FERNET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e DATABASE_URL=postgresql+psycopg://u:p@localhost:5432/db \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_SECONDS=900 \
            -e REFRESH_TOKEN_EXPIRE_SECONDS=1209600 \
            -e APP_ENV=production \
            -e LOG_TO_FILE=false \
            -e REDIS_URL=redis://localhost:6379/0 \
            "${{ env.IMAGE }}:${{ github.sha }}" \
            python -c "import app.main, celery_app"

  deploy:
    name: Deploy to Swarm manager
    needs: build-and-push
    runs-on: ubuntu-latest
    # protected environment 로 수동 승인 게이트를 걸 수 있다(REQ-INFRA-010).
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_SSH_HOST }}
          username: ${{ secrets.SWARM_SSH_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          # 호스트 키 검증(MITM 방지). 값은 "SHA256:" 접두사를 포함한 지문 그대로.
          # 시크릿이 없으면 빈 값 → 검증 생략(기존 동작). drone-ssh(Go x/crypto)는
          # ECDSA > RSA > Ed25519 순으로 호스트 키를 고르므로 그 키의 지문이어야 한다
          # (docs/deployment.md 10.1 절).
          fingerprint: ${{ secrets.SWARM_SSH_FINGERPRINT }}
          # 매니저 노드에 저장소 체크아웃이 존재한다고 가정(docker-stack.yml/scripts 사용).
          # IMAGE_TAG 를 불변 SHA 로 주입하고, 스택 업데이트 전 마이그레이션을 실행한다(REQ-INFRA-005).
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd "${DEPLOY_DIR:-/opt/kmcbeauty}"
            export IMAGE_TAG="ghcr.io/antam2010/kmcbeauty-api:${GITHUB_SHA}"
            echo "Deploying ${IMAGE_TAG}"
            fail() { echo "ERROR: $*" >&2; exit 1; }
            # ===== 사전 검증: 서버 상태를 바꾸기(체크아웃·마이그레이션·배포) 전에 모두 수행 =====
            # [1] 필수 Docker secret(REQ-INFRA-113). 회전 중이면 _v2 로 갱신(source 만 교체).
            REQUIRED_SECRETS="kmc_secret_key_v1 kmc_fernet_key_v1 kmc_database_url_v1 firebase_service_account"
            EXISTING_SECRETS="$(docker secret ls --format '{{.Name}}')"
            MISSING=""
            for s in $REQUIRED_SECRETS; do
              echo "$EXISTING_SECRETS" | grep -qx "$s" || MISSING="$MISSING $s"
            done
            [ -z "$MISSING" ] || fail "필수 Docker secret 누락:${MISSING}. 먼저 매니저 노드에서 docker secret create 로 등록하세요(docs/deployment.md)."
            # [2] .env.prod(비시크릿 설정) 존재와 내용.
            [ -f .env.prod ] || fail ".env.prod 가 매니저 노드에 없습니다. cp .env.prod.example .env.prod 후 값을 채우세요."
            # 주석이 아닌 정의 줄의 값(마지막 정의 기준, 공백 제거). 없으면 빈 문자열.
            env_get() { grep -E "^[[:space:]]*$1[[:space:]]*=" .env.prod | tail -n1 | cut -d= -f2- | tr -d '[:space:]' || true; }
            # [2-a] 시크릿 키 정의 금지: env 가 /run/secrets 파일보다 우선해 시크릿을 조용히 덮어쓴다.
            #       빈 값(KEY=)이나 값 없는 키(KEY)도 금지. 로그에는 줄 번호와 키 이름만 남긴다.
            SECRET_LINES="$(grep -nE '^[[:space:]]*(export[[:space:]]+)?(DATABASE_URL|SECRET_KEY|FERNET_KEY)[[:space:]]*(=|$)' .env.prod | cut -d= -f1 | paste -sd ' ' - || true)"
            [ -z "$SECRET_LINES" ] || fail ".env.prod 에 시크릿 키 정의가 있습니다(줄: ${SECRET_LINES}). Docker secret 값을 덮어쓰므로 해당 줄을 삭제하거나 주석 처리하세요."
            # [2-b] Redis: 컨테이너 안의 localhost 는 Redis 가 아니다. REDIS_URL 누락 시 기본값
            #       redis://redis 는 공유 네트워크의 다른 `redis` 로 해석될 수 있어 필수로 둔다.
            [ -n "$(env_get REDIS_URL)" ] || fail ".env.prod 에 REDIS_URL 이 없습니다. redis://kmcbeauty_redis:6379/0 으로 설정하세요."
            for key in REDIS_URL RATE_LIMIT_STORAGE_URI; do
              case "$(env_get "$key")" in
                *localhost*|*127.0.0.1*) fail ".env.prod 의 ${key} 값이 localhost/127.0.0.1 을 가리킵니다. 스택 Redis(kmcbeauty_redis)로 바꾸세요." ;;
              esac
            done
            [ -n "$(env_get RATE_LIMIT_STORAGE_URI)" ] || echo "WARN: RATE_LIMIT_STORAGE_URI 미설정 — memory://(레플리카별 카운터)로 동작합니다." >&2
            # [2-c] 프록시 신뢰: 비면 모든 요청이 NGINX IP 로 보여 rate limit 이 전 사용자 공용이 되고,
            #       '*' 면 X-Forwarded-For 맨 왼쪽(위조 가능) 값을 클라이언트 IP 로 쓴다.
            FWD_IPS="$(env_get FORWARDED_ALLOW_IPS)"
            [ -n "$FWD_IPS" ] || fail ".env.prod 의 FORWARDED_ALLOW_IPS 가 비어 있습니다. shared_network_prod 서브넷 CIDR 을 넣으세요: docker network inspect shared_network_prod -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'"
            case "$FWD_IPS" in
              *'*'*) fail "FORWARDED_ALLOW_IPS 에 '*' 가 있습니다. X-Forwarded-For 위조로 rate limit 을 우회할 수 있어 서브넷 CIDR 만 허용합니다." ;;
            esac
            # [3] 공유 네트워크는 Swarm 오버레이여야 한다(bridge 면 스택 서비스가 붙지 못함).
            NET_INFO="$(docker network inspect shared_network_prod -f '{{.Driver}} {{.Scope}}' 2>/dev/null || true)"
            [ "$NET_INFO" = "overlay swarm" ] || fail "shared_network_prod 가 Swarm 오버레이가 아닙니다(현재: ${NET_INFO:-없음 또는 이름 중복}). docs/deployment.md 10.1 절에 따라 attachable overlay 로 준비하세요."
            # 실제 서브넷이 FORWARDED_ALLOW_IPS 에 없으면 경고만(더 넓은 CIDR 을 의도했을 수 있음).
            for subnet in $(docker network inspect shared_network_prod -f '{{range .IPAM.Config}}{{.Subnet}} {{end}}'); do
              case ",${FWD_IPS}," in
                *",${subnet},"*) ;;
                *) echo "WARN: FORWARDED_ALLOW_IPS(${FWD_IPS})에 shared_network_prod 서브넷 ${subnet} 이 없습니다. 의도한 값인지 확인하세요." >&2 ;;
              esac
            done
            echo "OK: 사전 검증 통과(Docker secret · .env.prod · shared_network_prod)."
            # ===== 배포 =====
            # 배포 대상 커밋으로 고정한다(브랜치 tip 이 아니라 이 워크플로가 빌드한 SHA). 로컬 변경은 버린다.
            git fetch --prune origin
            git checkout --force --detach "${GITHUB_SHA}"
            # GHCR pull 권한이 사전 구성되어 있어야 한다(docker login ghcr.io).
            docker pull "${IMAGE_TAG}"
            # 배포 전 마이그레이션(expand/contract, 하위 호환). 파일 모드와 무관하게 bash 로 실행.
            bash scripts/deploy_migrate.sh
            # 불변 태그 주입 후 무중단 롤링 배포. --with-registry-auth: 다른 노드도 GHCR 에서 pull 가능.
            docker stack deploy --with-registry-auth -c docker-stack.yml kmcbeauty
        env:
          GITHUB_SHA: ${{ github.sha }}
