# =============================================================================
# kmcbeauty API — https://api-beauty.dongri.kr  →  kmcbeauty-api:8000 (shared_network_prod 의 컨테이너 이름)
# 배치 위치: server-mini2 스택의 ./nginx/conf.d/api-beauty.conf
# 원본: kmcbeauty-fastapi 저장소의 deploy/nginx/api-beauty.conf — 고칠 때 두 곳을 같이 고친다.
# 전제: kmcbeauty compose 프로젝트(web/kmcbeauty-fastapi 의 compose.prod.yaml)의 컨테이너 kmcbeauty-api 가
#   외부 bridge 네트워크 shared_network_prod 에 붙고, nginx 도 같은 네트워크에서 docker DNS(127.0.0.11)로
#   그 이름을 요청 시점에 해석한다. resolver + 변수 proxy_pass 라 컨테이너가 없어도 nginx 기동을 막지 않고
#   (502 만 남는다), 재배포로 컨테이너가 다시 만들어져 주소가 바뀌어도 리로드 없이 따라간다.
# 인증서: dongri.kr · *.dongri.kr (Cloudflare origin) — /etc/ssl/cloudflare/dongri/.
# 요청 횟수 제한은 앱(slowapi, Redis DB 6)이 한다. API 문서(/docs 등)는 앱이 운영(production)에서 끈다.
# 앱은 FORWARDED_ALLOW_IPS(shared_network_prod 의 이 nginx 주소)로 이 nginx 의 X-Forwarded-For 를 믿고, 맨 오른쪽의 믿지 않는
#   주소(= 아래 real_ip 로 복원한 실제 접속자)를 클라이언트 주소로 쓴다(uvicorn ProxyHeadersMiddleware).
# =============================================================================

# 접근 기록: 경로($uri)만 적는다. 검색어(고객 이름·전화번호)가 질의 문자열로 오므로
# $request · $request_uri · $args 는 넣지 않는다. http 수준 이름이라 kmc_ 로 시작한다.
log_format kmc_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name api-beauty.dongri.kr;
    access_log /var/log/nginx/access.log kmc_access;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-beauty.dongri.kr;

    ssl_certificate     /etc/ssl/cloudflare/dongri/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/dongri/privkey.pem;

    access_log /var/log/nginx/access.log kmc_access;

    # 업스트림 런타임 해석 — docker DNS, ipv6=off 로 AAAA 조회 차단.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kmc_api http://kmcbeauty-api:8000;

    # 실제 접속자 주소: Cloudflare 대역에서 온 연결의 CF-Connecting-IP 만 믿는다.
    # 목록은 dongri.conf 와 같다(https://www.cloudflare.com/ips — 대역은 바뀐다).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # JSON API 라 업로드가 없다. 연락처 일괄 동기화 본문을 고려해 기본 1m 보다 넉넉히 둔다.
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # 요청·응답 머리글은 서버 수준에서만 정한다. location 안에 proxy_set_header 나 add_header 가
    # 하나라도 있으면 그 location 은 서버 수준 것을 하나도 물려받지 못한다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HSTS 는 TLS 를 끝내는 이쪽이 소유한다. always 가 없으면 nginx 자신의 오류 응답에 안 붙는다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass $kmc_api;
    }
}
